services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: komorebi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-komorebi}
      POSTGRES_DB: komorebi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komorebi -d komorebi"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
